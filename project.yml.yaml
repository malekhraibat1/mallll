name: SolarEngineer

options:
  bundleIdPrefix: com.malek
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  postGenCommand: sed -i.bak -E 's|objectVersion = [0-9]+|objectVersion = 56|' SolarEngineer.xcodeproj/project.pbxproj

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  SolarEngineer:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SolarEngineerApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malek.SolarEngineer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1,2"