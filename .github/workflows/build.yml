name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Archive
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project SolarEngineer.xcodeproj \
            -scheme SolarEngineer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/SolarEngineer.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Show errors on failure
        if: failure()
        run: grep -i "error:" build.log | head -30

      - name: Make IPA
        run: |
          echo "=== Looking for .app in xcarchive ==="
          find $RUNNER_TEMP/SolarEngineer.xcarchive -maxdepth 4 -type d
          echo ""
          
          APP_PATH=$(find $RUNNER_TEMP/SolarEngineer.xcarchive -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found!"
            exit 1
          fi
          
          echo "✅ Found app at: $APP_PATH"
          
          mkdir -p $RUNNER_TEMP/Payload
          cp -R "$APP_PATH" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r SolarEngineer.ipa Payload
          
          echo "=== IPA ready ==="
          ls -la $RUNNER_TEMP/SolarEngineer.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SolarEngineer-Unsigned-IPA
          path: $RUNNER_TEMP/SolarEngineer.ipa
          retention-days: 30
