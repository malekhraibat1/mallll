name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show files
        run: |
          echo "=== All files ==="
          find . -type f -not -path "./.git/*" | head -50

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project SolarEngineer.xcodeproj \
            -scheme SolarEngineer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/SolarEngineer.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Show errors on failure
        if: failure()
        run: |
          echo "=== ERRORS ==="
          grep -i "error:" build.log | head -30

      - name: Make IPA
        if: success()
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/SolarEngineer.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r SolarEngineer.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SolarEngineer-Unsigned-IPA
          path: $RUNNER_TEMP/SolarEngineer.ipa
          retention-days: 30
